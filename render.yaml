services:
  - type: web
    name: acdyon-job-scraper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INGEST_INTERVAL_MINUTES
        value: "30"
      - key: DB_URL
        value: "sqlite:///./jobs.db"
      - key: RATE_LIMIT_BASE_DELAY_SECONDS
        value: "3"
      - key: STALE_AFTER_MINUTES
        value: "120"
      - key: FAILURE_THRESHOLD
        value: "3"
      - key: REMOTEOK_URL
        value: "https://remoteok.com/api"
      - key: ARBEITNOW_URL
        value: "https://www.arbeitnow.com/api/job-board-api"
